  <line x1="440" y1="245" x2="640" y2="245" stroke="#B8941F" stroke-width="1" opacity=".6"/>

  <!-- Números em grid 2x3 -->
  <g transform="translate(80, 290)">

    <g transform="translate(0, 0)">
