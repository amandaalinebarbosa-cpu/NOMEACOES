  <!-- CTA -->
  <text x="540" y="900" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#B8941F" font-weight="600">PESQUISA EM SEGUNDOS · R$ 29/MÊS</text>
  <text x="540" y="970" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">peritusdominus.com.br/nomeacoes</text>
