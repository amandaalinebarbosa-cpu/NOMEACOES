      <text x="460" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#B8941F" font-weight="600">NOMEAÇÕES REGISTRADAS</text>
    </g>

    <line x1="150" y1="160" x2="770" y2="160" stroke="#B8941F" stroke-width="1" opacity=".3"/>

    <g transform="translate(0, 190)">
      <text x="230" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="80" font-weight="700" fill="#B8941F">24</text>
      <text x="230" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#E8E3D0" font-weight="600">TRIBUNAIS DO</text>
      <text x="230" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#E8E3D0" font-weight="600">TRABALHO</text>

      <line x1="460" y1="20" x2="460" y2="120" stroke="#B8941F" stroke-width="1" opacity=".3"/>

      <text x="690" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="80" font-weight="700" fill="#ffffff">82.519</text>
      <text x="690" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#E8E3D0" font-weight="600">PROFISSIONAIS</text>
    </g>

    <line x1="150" y1="350" x2="770" y2="350" stroke="#B8941F" stroke-width="1" opacity=".3"/>

    <g transform="translate(0, 380)">
      <text x="230" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#ffffff">R$ 2,1 Bi</text>
      <text x="230" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#E8E3D0" font-weight="600">EM HONORÁRIOS</text>

      <line x1="460" y1="20" x2="460" y2="120" stroke="#B8941F" stroke-width="1" opacity=".3"/>

      <text x="690" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#B8941F">desde</text>
      <text x="690" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#B8941F">2015</text>
