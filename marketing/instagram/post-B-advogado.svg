<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  style="stop-color:#F5F0E6"/>
      <stop offset="100%" style="stop-color:#EBE4D1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  style="stop-color:#B8941F;stop-opacity:.4"/>
      <stop offset=".5" style="stop-color:#D4AB2D"/>
      <stop offset="1"  style="stop-color:#B8941F;stop-opacity:.4"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="100" fill="#1E3A2A"/>
  <rect x="0" y="100" width="1080" height="4" fill="url(#gold)"/>

  <!-- brand topo (sobre faixa verde) -->
  <g transform="translate(80, 35)">
    <circle cx="25" cy="25" r="22" fill="none" stroke="#B8941F" stroke-width="2"/>
    <text x="25" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#B8941F">PD</text>
    <text x="68" y="22" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">PERITUS DOMINUS</text>
    <text x="68" y="40" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#B8941F">NOMEAÇÕES SIGEO</text>
  </g>

  <!-- Badge -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="320" height="40" rx="20" fill="#1E3A2A"/>
    <text x="160" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#B8941F" font-weight="700">ADVOGADO TRABALHISTA</text>
  </g>

  <!-- Pergunta -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#1E3A2A">Você sabe quais</text>
  <text x="80" y="355" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#1E3A2A">peritos a vara X</text>
  <text x="80" y="420" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#B8941F">mais nomeia?</text>

  <line x1="80" y1="460" x2="260" y2="460" stroke="#B8941F" stroke-width="2"/>

  <text x="80" y="510" font-family="Arial, sans-serif" font-size="22" fill="#2C2C2C">Sabe se o perito que foi nomeado</text>
  <text x="80" y="542" font-family="Arial, sans-serif" font-size="22" fill="#2C2C2C">no seu processo tem perfil pro caso?</text>

  <!-- 3 features -->
  <g transform="translate(80, 620)">
    <rect x="0"   y="0" width="290" height="90" rx="10" fill="#ffffff" stroke="#E9E4D6"/>
    <rect x="0"   y="0" width="290" height="3" fill="#B8941F"/>
    <text x="20"  y="38" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#8B8477" font-weight="700">RANKING</text>
    <text x="20"  y="70" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1E3A2A">Varas × perito</text>

    <rect x="310" y="0" width="290" height="90" rx="10" fill="#ffffff" stroke="#E9E4D6"/>
    <rect x="310" y="0" width="290" height="3" fill="#B8941F"/>
    <text x="330" y="38" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#8B8477" font-weight="700">HISTÓRICO</text>
    <text x="330" y="70" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1E3A2A">Todos os TRTs</text>

    <rect x="620" y="0" width="290" height="90" rx="10" fill="#ffffff" stroke="#E9E4D6"/>
    <rect x="620" y="0" width="290" height="3" fill="#B8941F"/>
    <text x="640" y="38" font-family="Arial, sans-serif" font-size="10" letter-spacing="2" fill="#8B8477" font-weight="700">RELATÓRIO</text>
    <text x="640" y="70" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#1E3A2A">PDF pra laudo</text>
  </g>

  <!-- Caixa inferior -->
  <rect x="0" y="920" width="1080" height="160" fill="#1E3A2A"/>
  <rect x="0" y="916" width="1080" height="4" fill="url(#gold)"/>

  <text x="80" y="970" font-family="Arial, sans-serif" font-size="12" letter-spacing="3" fill="#B8941F">PAINEL ÚNICO · R$ 29/MÊS · SEM FIDELIDADE</text>
  <text x="80" y="1030" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">peritusdominus.com.br/nomeacoes</text>
</svg>
